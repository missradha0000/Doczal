<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { background: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #cccccc; }
        #outputImage { max-width: 100%; margin-top: 20px; border-radius: 8px; display: none; }
        .loading { display: none; color: #666; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Background Remover</h2>
    <p>अपनी फोटो अपलोड करें (यह मुश्किल से मुश्किल फोटो को भी प्रोसेस कर सकता है)</p>
    
    <input type="file" id="imageInput" accept="image/*"><br>
    <button id="processBtn" disabled>बैकग्राउंड हटाएं</button>
    
    <div class="loading" id="loader">AI मॉडल प्रोसेस कर रहा है, कृपया प्रतीक्षा करें...</div>
    <br>
    <img id="outputImage" alt="Processed Output">
</div>

<!-- API आधारित या Wasm आधारित लाइब्रेरी को यहाँ कनेक्ट करें -->
<script type="module">
    // नोट: एडवांस बैकग्राउंड रिमूवल के लिए हम ओपन-सोर्स WASM लाइब्रेरी इम्पोर्ट कर सकते हैं
    import imglyRemoveBackground from 'https://jsdelivr.net';

    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const outputImage = document.getElementById('outputImage');
    const loader = document.getElementById('loader');

    let selectedFile;

    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            processBtn.disabled = false;
        }
    });

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        
        loader.style.display = 'block';
        processBtn.disabled = true;
        outputImage.style.display = 'none';

        try {
            // यह लाइब्रेरी ब्राउज़र के अंदर ही एडवांस AI मॉडल चलाती है
            const blob = await imglyRemoveBackground(selectedFile);
            const url = URL.createObjectURL(blob);
            
            outputImage.src = url;
            outputImage.style.display = 'inline-block';
        } catch (error) {
            alert("इमेज प्रोसेस करने में त्रुटि हुई। कृपया दूसरी इमेज ट्राई करें।");
            console.error(error);
        } finally {
            loader.style.display = 'none';
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
