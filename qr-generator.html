<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator – InstaPic Tools</title>
    <!-- QRCode.js for generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <!-- jsQR for decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            color: #0f172a;
            padding: 0 20px 50px;
        }

        /* ===== HEADER ===== */
        .app-header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 0 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #2563eb, #1e40af);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(145deg, #1e293b, #334155);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text span {
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-link {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 40px;
            background: #dbeafe;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .back-link:hover {
            background: #bfdbfe;
            transform: translateX(-4px);
        }

        /* ===== TOOL CONTAINER ===== */
        .tool-container {
            max-width: 1200px;
            margin: 28px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        /* ===== LEFT: INPUT PANEL ===== */
        .input-panel {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .input-panel h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #0f172a;
        }
        .input-panel .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* QR Type Buttons */
        .qr-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }
        .qr-type-btn {
            padding: 12px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .qr-type-btn i {
            font-size: 16px;
            color: #94a3b8;
        }
        .qr-type-btn:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }
        .qr-type-btn.active {
            border-color: #2563eb;
            background: #dbeafe;
            color: #2563eb;
        }
        .qr-type-btn.active i {
            color: #2563eb;
        }

        /* ===== INPUT AREAS ===== */
        .input-area {
            margin-bottom: 20px;
        }
        .input-area label {
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            display: block;
            margin-bottom: 6px;
        }
        .input-area textarea,
        .input-area input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.25s;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            resize: vertical;
        }
        .input-area textarea:focus,
        .input-area input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
            background: #ffffff;
        }
        .input-area textarea {
            min-height: 100px;
        }
        .input-area .char-count {
            text-align: right;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* File upload styling */
        .file-upload-area {
            border: 2px dashed #e2e8f0;
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            background: #f8fafc;
            transition: 0.2s;
            cursor: pointer;
        }
        .file-upload-area:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .file-upload-area i {
            font-size: 40px;
            color: #94a3b8;
            display: block;
            margin-bottom: 12px;
        }
        .file-upload-area p {
            color: #64748b;
            font-size: 14px;
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        .file-upload-area .file-name {
            font-weight: 600;
            color: #0f172a;
            margin-top: 8px;
        }

        /* Redesign specific */
        .redesign-options {
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .redesign-options.show {
            display: flex;
        }
        .redesign-options .field {
            flex: 1;
            min-width: 140px;
        }
        .redesign-options .field label {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        /* Design templates */
        .design-templates {
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .design-templates.show {
            display: flex;
        }
        .design-template-btn {
            padding: 10px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .design-template-btn i {
            font-size: 14px;
        }
        .design-template-btn:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }
        .design-template-btn.active {
            border-color: #2563eb;
            background: #dbeafe;
            color: #2563eb;
        }

        /* ===== DESIGN OPTIONS (color, size) ===== */
        .design-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .design-options label {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .design-options input[type="color"] {
            width: 100%;
            height: 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            cursor: pointer;
            background: #f8fafc;
        }
        .design-options input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            outline: none;
        }
        .design-options input[type="number"]:focus {
            border-color: #2563eb;
        }
        .design-options select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
        }
        .design-options select:focus {
            border-color: #2563eb;
        }

        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        .generate-btn:active {
            transform: translateY(0);
        }

        /* ===== RIGHT: PREVIEW ===== */
        .preview-panel {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .preview-panel h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }
        .qr-preview-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 2px dashed #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px;
            transition: 0.2s;
        }
        .qr-preview-box #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-preview-box #qrcode canvas {
            max-width: 100%;
            height: auto;
        }
        .qr-preview-box .placeholder-text {
            color: #94a3b8;
            font-size: 15px;
            text-align: center;
        }
        .qr-preview-box .placeholder-text i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .download-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .download-actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            min-width: 120px;
        }
        .download-png {
            background: #0f172a;
            color: #fff;
        }
        .download-png:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }
        .download-svg {
            background: #e9eef4;
            color: #0f172a;
        }
        .download-svg:hover {
            background: #dce2ec;
            transform: translateY(-2px);
        }

        /* ===== TOAST ===== */
        .rk-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #f1f5f9;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .rk-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .tool-container {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .qr-preview-box {
                max-width: 280px;
            }
        }
        @media (max-width: 600px) {
            .app-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 20px 0 16px;
            }
            .logo-text {
                font-size: 24px;
            }
            .qr-type-grid {
                grid-template-columns: 1fr 1fr;
            }
            .design-options {
                grid-template-columns: 1fr 1fr;
            }
            .input-panel,
            .preview-panel {
                padding: 20px 16px;
            }
            .download-actions button {
                flex: 1 1 100%;
            }
            .qr-preview-box {
                max-width: 240px;
                min-height: 220px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">IP</div>
            <div class="logo-text">Insta<span>Pic</span></div>
        </div>
        <a href="#" class="back-link" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Back to Tools
        </a>
    </header>

    <!-- ===== TOOL CONTAINER ===== -->
    <div class="tool-container">

        <!-- LEFT PANEL -->
        <div class="input-panel">
            <h1><i class="fas fa-qrcode" style="color:#2563eb; margin-right:10px;"></i>QR Code Generator</h1>
            <p class="subtitle">Create, customize, and redesign QR codes.</p>

            <!-- Type Buttons -->
            <div class="qr-type-grid" id="qrTypeGrid">
                <button class="qr-type-btn active" data-type="text"><i class="fas fa-font"></i> Text</button>
                <button class="qr-type-btn" data-type="link"><i class="fas fa-link"></i> Link</button>
                <button class="qr-type-btn" data-type="image"><i class="fas fa-image"></i> Image</button>
                <button class="qr-type-btn" data-type="redesign"><i class="fas fa-palette"></i> Redesign</button>
            </div>

            <!-- ===== INPUT AREA (dynamic) ===== -->
            <div class="input-area" id="inputArea">
                <label id="inputLabel" for="qrInput"><i class="fas fa-edit"></i> Enter your text</label>
                <textarea id="qrInput" placeholder="Type or paste your content here..."></textarea>
                <div class="char-count"><span id="charCount">0</span> characters</div>
            </div>

            <!-- ===== IMAGE UPLOAD (hidden by default) ===== -->
            <div class="input-area" id="imageUploadArea" style="display:none;">
                <label><i class="fas fa-upload"></i> Upload Image / PDF</label>
                <div class="file-upload-area" id="fileDropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click or drag to upload<br><small>Supports JPG, PNG, PDF</small></p>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" />
                    <div class="file-name" id="fileName"></div>
                </div>
                <div style="margin-top:10px; font-size:13px; color:#64748b;">
                    <i class="fas fa-info-circle"></i> QR will encode file name (max 2KB data)
                </div>
            </div>

            <!-- ===== REDESIGN OPTIONS (hidden by default) ===== -->
            <div class="redesign-options" id="redesignOptions">
                <div class="field">
                    <label><i class="fas fa-upload"></i> Upload QR Image</label>
                    <div class="file-upload-area" style="padding:16px;" id="redesignFileDrop">
                        <i class="fas fa-qrcode" style="font-size:24px;"></i>
                        <p style="font-size:13px;">Click to upload QR code image</p>
                        <input type="file" id="redesignFileInput" accept="image/*" />
                        <div class="file-name" id="redesignFileName"></div>
                    </div>
                </div>
                <div class="field">
                    <label><i class="fas fa-paste"></i> Or paste content</label>
                    <input type="text" id="redesignContentInput" placeholder="Paste text or URL from QR" />
                </div>
            </div>

            <!-- ===== DESIGN TEMPLATES (for Redesign) ===== -->
            <div class="design-templates" id="designTemplates">
                <button class="design-template-btn active" data-template="classic"><i class="fas fa-square"></i> Classic</button>
                <button class="design-template-btn" data-template="rounded"><i class="fas fa-circle"></i> Rounded</button>
                <button class="design-template-btn" data-template="dots"><i class="fas fa-circle-dot"></i> Dots</button>
                <button class="design-template-btn" data-template="logo"><i class="fas fa-image"></i> With Logo</button>
                <button class="design-template-btn" data-template="gradient"><i class="fas fa-fill-drip"></i> Gradient</button>
            </div>

            <!-- ===== DESIGN OPTIONS (color, size, etc.) ===== -->
            <div class="design-options" id="designOptions">
                <div>
                    <label>Color</label>
                    <input type="color" id="qrColor" value="#0f172a" />
                </div>
                <div>
                    <label>BG Color</label>
                    <input type="color" id="bgColor" value="#ffffff" />
                </div>
                <div>
                    <label>Size</label>
                    <input type="number" id="qrSize" value="256" min="128" max="600" step="8" />
                </div>
            </div>

            <!-- Error Correction & Margin -->
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
                <div style="flex:1; min-width:100px;">
                    <label style="font-weight:600; font-size:13px; color:#475569;">Error Correction</label>
                    <select id="errorLevel" style="width:100%; padding:10px 12px; border:2px solid #e2e8f0; border-radius:12px; font-size:14px; background:#f8fafc; outline:none;">
                        <option value="L">Low (L)</option>
                        <option value="M" selected>Medium (M)</option>
                        <option value="Q">Quartile (Q)</option>
                        <option value="H">High (H)</option>
                    </select>
                </div>
                <div style="flex:1; min-width:100px;">
                    <label style="font-weight:600; font-size:13px; color:#475569;">Margin (px)</label>
                    <input type="number" id="qrMargin" value="4" min="0" max="20" style="width:100%; padding:10px 12px; border:2px solid #e2e8f0; border-radius:12px; font-size:14px; background:#f8fafc; outline:none;" />
                </div>
            </div>

            <!-- Generate Button -->
            <button class="generate-btn" id="generateBtn">
                <i class="fas fa-rotate"></i> Generate QR Code
            </button>
        </div>

        <!-- RIGHT PANEL: PREVIEW -->
        <div class="preview-panel">
            <h2><i class="fas fa-eye" style="color:#2563eb; margin-right:8px;"></i>Preview</h2>
            <div class="qr-preview-box" id="qrPreviewBox">
                <div id="qrcode">
                    <div class="placeholder-text">
                        <i class="fas fa-qrcode"></i>
                        <span>Your QR code will appear here</span>
                    </div>
                </div>
            </div>
            <div class="download-actions">
                <button class="download-png" id="downloadPng"><i class="fas fa-download"></i> PNG</button>
                <button class="download-svg" id="downloadSvg"><i class="fas fa-download"></i> SVG</button>
            </div>
            <p style="font-size:12px; color:#94a3b8; margin-top:12px; text-align:center;">
                <i class="fas fa-info-circle"></i> Scan with any QR scanner
            </p>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="rk-toast" id="toast"></div>

    <script>
        // ============================================================
        //  DOM REFS
        // ============================================================
        const typeBtns = document.querySelectorAll('.qr-type-btn');
        const inputArea = document.getElementById('inputArea');
        const qrInput = document.getElementById('qrInput');
        const charCount = document.getElementById('charCount');
        const inputLabel = document.getElementById('inputLabel');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const redesignOptions = document.getElementById('redesignOptions');
        const redesignFileInput = document.getElementById('redesignFileInput');
        const redesignFileName = document.getElementById('redesignFileName');
        const redesignContentInput = document.getElementById('redesignContentInput');
        const designTemplates = document.getElementById('designTemplates');
        const templateBtns = document.querySelectorAll('.design-template-btn');
        const designOptions = document.getElementById('designOptions');
        const qrColor = document.getElementById('qrColor');
        const bgColor = document.getElementById('bgColor');
        const qrSize = document.getElementById('qrSize');
        const errorLevel = document.getElementById('errorLevel');
        const qrMargin = document.getElementById('qrMargin');
        const generateBtn = document.getElementById('generateBtn');
        const qrContainer = document.getElementById('qrcode');
        const downloadPng = document.getElementById('downloadPng');
        const downloadSvg = document.getElementById('downloadSvg');
        const toast = document.getElementById('toast');

        let currentType = 'text';
        let currentQR = null;
        let currentData = '';
        let uploadedFileData = null; // for image type
        let redesignData = ''; // for redesign content
        let currentTemplate = 'classic';

        // ============================================================
        //  TYPE SWITCHING
        // ============================================================
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;

                // Reset all input areas
                inputArea.style.display = 'none';
                imageUploadArea.style.display = 'none';
                redesignOptions.classList.remove('show');
                designTemplates.classList.remove('show');
                // Show design options by default (but for redesign we hide colors)
                designOptions.style.display = 'grid';

                // Clear inputs
                qrInput.value = '';
                charCount.textContent = '0';
                fileName.textContent = '';
                redesignFileName.textContent = '';
                redesignContentInput.value = '';
                uploadedFileData = null;
                redesignData = '';

                switch (currentType) {
                    case 'text':
                        inputArea.style.display = 'block';
                        inputLabel.innerHTML = '<i class="fas fa-font"></i> Enter your text (no limit)';
                        qrInput.placeholder = 'Type or paste any text...';
                        qrInput.style.display = 'block';
                        // Ensure textarea is visible
                        break;
                    case 'link':
                        inputArea.style.display = 'block';
                        inputLabel.innerHTML = '<i class="fas fa-link"></i> Enter URL (video, image, social, post)';
                        qrInput.placeholder = 'https://example.com/...';
                        qrInput.style.display = 'block';
                        break;
                    case 'image':
                        imageUploadArea.style.display = 'block';
                        // hide textarea
                        inputArea.style.display = 'none';
                        break;
                    case 'redesign':
                        inputArea.style.display = 'none';
                        imageUploadArea.style.display = 'none';
                        redesignOptions.classList.add('show');
                        designTemplates.classList.add('show');
                        // Hide color pickers for redesign (they will use templates)
                        designOptions.style.display = 'none';
                        break;
                }

                // Clear QR preview
                qrContainer.innerHTML = `<div class="placeholder-text"><i class="fas fa-qrcode"></i><span>Your QR code will appear here</span></div>`;
                // Update generate button text
                generateBtn.innerHTML = `<i class="fas fa-rotate"></i> Generate QR Code`;
            });
        });

        // ============================================================
        //  FILE UPLOAD HANDLING (for Image type)
        // ============================================================
        const fileDropArea = document.getElementById('fileDropArea');
        fileDropArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fileName.textContent = file.name;
            // Read file as data URL (base64)
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dataUrl = ev.target.result;
                // Limit size: if > 2KB, show warning but still encode filename
                if (dataUrl.length > 2000) {
                    showToast('⚠️ File too large, encoding only filename.');
                    uploadedFileData = 'File: ' + file.name;
                } else {
                    uploadedFileData = dataUrl; // encode the whole data
                }
                // Auto-generate after upload
                setTimeout(generateQR, 300);
            };
            reader.readAsDataURL(file);
        });

        // ============================================================
        //  REDESIGN FILE UPLOAD (decode QR from image)
        // ============================================================
        const redesignDrop = document.getElementById('redesignFileDrop');
        redesignDrop.addEventListener('click', () => redesignFileInput.click());
        redesignFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            redesignFileName.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    // Decode QR using jsQR
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);
                    if (code && code.data) {
                        redesignContentInput.value = code.data;
                        redesignData = code.data;
                        showToast('✅ QR decoded successfully!');
                        setTimeout(generateQR, 300);
                    } else {
                        showToast('❌ Could not decode QR. Try a clearer image.');
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Redesign content input
        redesignContentInput.addEventListener('input', () => {
            redesignData = redesignContentInput.value.trim();
        });

        // ============================================================
        //  DESIGN TEMPLATES (for Redesign)
        // ============================================================
        templateBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                templateBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTemplate = btn.dataset.template;
                // Apply template: set colors and styles
                applyTemplate(currentTemplate);
                // Regenerate if data exists
                if (redesignData || qrInput.value) {
                    generateQR();
                }
            });
        });

        function applyTemplate(template) {
            // Preset color schemes and styles
            switch (template) {
                case 'classic':
                    qrColor.value = '#0f172a';
                    bgColor.value = '#ffffff';
                    break;
                case 'rounded':
                    qrColor.value = '#2563eb';
                    bgColor.value = '#f0f4fe';
                    // We'll add rounded style via CSS later
                    break;
                case 'dots':
                    qrColor.value = '#7c3aed';
                    bgColor.value = '#f5f0ff';
                    break;
                case 'logo':
                    qrColor.value = '#dc2626';
                    bgColor.value = '#fff5f5';
                    break;
                case 'gradient':
                    qrColor.value = '#e11d48';
                    bgColor.value = '#fef2f2';
                    break;
                default:
                    qrColor.value = '#0f172a';
                    bgColor.value = '#ffffff';
            }
        }

        // ============================================================
        //  GENERATE QR
        // ============================================================
        function generateQR() {
            let data = '';

            // Get data based on current type
            if (currentType === 'text' || currentType === 'link') {
                data = qrInput.value.trim();
            } else if (currentType === 'image') {
                if (uploadedFileData) {
                    data = uploadedFileData;
                } else {
                    showToast('⚠️ Please upload an image first.');
                    return;
                }
            } else if (currentType === 'redesign') {
                // Use redesign data from input or decoded
                data = redesignContentInput.value.trim() || redesignData;
                if (!data) {
                    showToast('⚠️ Please upload a QR image or paste content.');
                    return;
                }
            }

            if (!data) {
                showToast('⚠️ Please enter some content first.');
                return;
            }

            // Check size limit for QR (max ~3KB)
            if (data.length > 3000) {
                showToast('⚠️ Data too large for QR. Please shorten.');
                return;
            }

            currentData = data;

            // Get design options
            const color = qrColor.value;
            const bg = bgColor.value;
            const size = parseInt(qrSize.value) || 256;
            const ec = errorLevel.value;
            const margin = parseInt(qrMargin.value) || 4;

            // Clear previous QR
            qrContainer.innerHTML = '';

            try {
                // For redesign with templates, we might want custom rendering
                // But we use QRCode.js which only supports basic shapes.
                // We'll apply rounded corners via CSS later.
                currentQR = new QRCode(qrContainer, {
                    text: data,
                    width: size,
                    height: size,
                    colorDark: color,
                    colorLight: bg,
                    correctLevel: getErrorCorrection(ec),
                    margin: margin,
                });

                // Apply template effects (if redesign)
                if (currentType === 'redesign') {
                    applyTemplateEffects(currentTemplate);
                }

                showToast('✅ QR Code generated!');
            } catch (err) {
                showToast('❌ Error: ' + err.message);
                console.error(err);
            }
        }

        function getErrorCorrection(level) {
            switch (level) {
                case 'L':
                    return QRCode.CorrectLevel.L;
                case 'M':
                    return QRCode.CorrectLevel.M;
                case 'Q':
                    return QRCode.CorrectLevel.Q;
                case 'H':
                    return QRCode.CorrectLevel.H;
                default:
                    return QRCode.CorrectLevel.M;
            }
        }

        // ============================================================
        //  APPLY TEMPLATE EFFECTS (CSS modifications)
        // ============================================================
        function applyTemplateEffects(template) {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) return;
            // We can't easily change module shapes with QRCode.js.
            // We'll add a class to the container for styling.
            qrContainer.className = 'template-' + template;
            // For logo, we could overlay an image, but that's complex.
            // We'll just change colors via template.
        }

        // ============================================================
        //  GENERATE BUTTON
        // ============================================================
        generateBtn.addEventListener('click', generateQR);

        // Enter key support for text/link
        qrInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && currentType !== 'text') {
                e.preventDefault();
                generateQR();
            }
        });

        // ============================================================
        //  DOWNLOAD PNG
        // ============================================================
        downloadPng.addEventListener('click', () => {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                showToast('⚠️ Generate a QR code first.');
                return;
            }
            const link = document.createElement('a');
            link.download = 'qr-code.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('📥 PNG downloaded!');
        });

        // ============================================================
        //  DOWNLOAD SVG
        // ============================================================
        downloadSvg.addEventListener('click', () => {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                showToast('⚠️ Generate a QR code first.');
                return;
            }
            // Simplified SVG generation using canvas data
            const w = canvas.width;
            const h = canvas.height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, w, h);
            const pixels = imageData.data;
            const color = qrColor.value;
            const bg = bgColor.value;
            const margin = parseInt(qrMargin.value) || 4;

            // Find module size
            let firstDarkX = -1,
                firstDarkY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    if (pixels[idx] < 128) {
                        if (firstDarkX === -1) firstDarkX = x;
                        firstDarkY = y;
                        break;
                    }
                }
                if (firstDarkX !== -1) break;
            }
            if (firstDarkX === -1) {
                showToast('⚠️ Could not extract QR data for SVG.');
                return;
            }
            let moduleW = 1;
            for (let x = firstDarkX + 1; x < w; x++) {
                const idx = (firstDarkY * w + x) * 4;
                if (pixels[idx] < 128) {
                    moduleW = x - firstDarkX;
                    break;
                }
            }
            const modulesCount = Math.floor((w - margin * 2) / moduleW);
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
            svg += `<rect width="${w}" height="${h}" fill="${bg}" />`;
            // For rounded template, use rx on rects
            const rx = (currentTemplate === 'rounded') ? moduleW * 0.4 : 0;
            for (let row = 0; row < modulesCount; row++) {
                for (let col = 0; col < modulesCount; col++) {
                    const x = margin + col * moduleW;
                    const y = margin + row * moduleW;
                    const idx = (y * w + x) * 4;
                    if (pixels[idx] < 128) {
                        svg +=
                            `<rect x="${x}" y="${y}" width="${moduleW}" height="${moduleW}" fill="${color}" rx="${rx}" />`;
                    }
                }
            }
            svg += '</svg>';

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'qr-code.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('📥 SVG downloaded!');
        });

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimeout;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        //  INIT – clear all pre-filled data, show empty
        // ============================================================
        // Ensure all inputs are empty
        qrInput.value = '';
        charCount.textContent = '0';
        fileName.textContent = '';
        redesignFileName.textContent = '';
        redesignContentInput.value = '';
        uploadedFileData = null;
        redesignData = '';
        qrContainer.innerHTML = `<div class="placeholder-text"><i class="fas fa-qrcode"></i><span>Your QR code will appear here</span></div>`;

        // Auto-generate on design change (for non-redesign)
        [qrColor, bgColor, qrSize, errorLevel, qrMargin].forEach(el => {
            el.addEventListener('change', () => {
                if (currentType !== 'redesign' && (qrInput.value.trim() || uploadedFileData)) {
                    generateQR();
                }
            });
            el.addEventListener('input', () => {
                if (el.id !== 'qrSize' && el.id !== 'qrMargin') {
                    // only on change
                }
            });
        });

        // Size/margin debounce
        let designTimeout;
        [qrSize, qrMargin].forEach(el => {
            el.addEventListener('input', () => {
                clearTimeout(designTimeout);
                designTimeout = setTimeout(() => {
                    if (currentType !== 'redesign' && (qrInput.value.trim() || uploadedFileData)) {
                        generateQR();
                    }
                }, 300);
            });
        });

        // Also trigger generate when redesign content changes
        redesignContentInput.addEventListener('input', () => {
            if (currentType === 'redesign') {
                clearTimeout(designTimeout);
                designTimeout = setTimeout(() => {
                    if (redesignContentInput.value.trim()) {
                        generateQR();
                    }
                }, 400);
            }
        });

        // ============================================================
        //  EXPOSE goHome
        // ============================================================
        window.goHome = function() {
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
